```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="/ui/style.css">
</head>
<body>

    <header>
        <h1>Student Management</h1>
        <p>Manage your student records easily</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Add a Student</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">Student Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter student age"
                        min="1"
                        required
                    >
                </div>

                <button type="submit">Add Student</button>
                <p id="message"></p>
            </form>
        </section>

        <section class="card">
            <div class="table-header">
                <h2>Student Records</h2>
                <button type="button" id="refreshBtn" class="secondary">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr>
                            <td colspan="3">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Student Management API | FastAPI + PostgreSQL</p>
    </footer>

    <script>
        const API_URL = "/students";

        const form = document.getElementById("studentForm");
        const table = document.getElementById("studentTable");
        const message = document.getElementById("message");

        async function loadStudents() {
            table.innerHTML =
                '<tr><td colspan="3">Loading students...</td></tr>';

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Could not load students");
                }

                const students = await response.json();
                table.innerHTML = "";

                if (students.length === 0) {
                    table.innerHTML =
                        '<tr><td colspan="3">No students found.</td></tr>';
                    return;
                }

                students.forEach(student => {
                    const row = document.createElement("tr");

                    [student.id, student.name, student.age].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    table.appendChild(row);
                });
            } catch (error) {
                table.innerHTML =
                    '<tr><td colspan="3">Unable to load students. Check the API.</td></tr>';
                console.error(error);
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const age = Number(document.getElementById("age").value);

            if (!name || !Number.isInteger(age) || age <= 0) {
                message.textContent = "Enter a valid name and age.";
                message.className = "error";
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, age })
                });

                if (!response.ok) {
                    throw new Error("Failed to add student");
                }

                message.textContent = "Student added successfully!";
                message.className = "success";
                form.reset();
                await loadStudents();
            } catch (error) {
                message.textContent =
                    "Could not add student. Check your API endpoint.";
                message.className = "error";
                console.error(error);
            }
        });

        document.getElementById("refreshBtn").addEventListener(
            "click", loadStudents
        );

        loadStudents();
    </script>

</body>
</html>
