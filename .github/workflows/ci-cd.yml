
name: FastAPI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Build Docker image
        run: docker build -t ankitachoudhary2005/std-api:test .

      - name: Create Docker network
        run: docker network create student-api-network

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-api-container \
            --network student-api-network \
            -p 8000:8000 \
            ankitachoudhary2005/std-api:test

      - name: Check API response
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-api-container
          exit 1

      - name: Stop test container
        if: always()
        run: |
          docker rm -f student-api-container || true
          docker network rm student-api-network || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ankitachoudhary2005/std-api:latest

